# EXEMPLO — valores fictícios. Copie para secret.yaml (fora do git), preencha e aplique:
#   oc apply -f openshift/secret.yaml
# Ou, mais simples, a partir do seu .env:
#   oc create secret generic hidratamais-secrets --from-env-file=.env
apiVersion: v1
kind: Secret
metadata:
  name: hidratamais-secrets
  labels:
    app: hidratamais
type: Opaque
stringData:
  DB_DRIVER: "cosmos"
  COSMOS_ENDPOINT: "https://SUA-CONTA.documents.azure.com:443/"
  COSMOS_KEY: "COLE-AQUI-A-PRIMARY-KEY"
  COSMOS_DATABASE: "hidratamais"
  CORS_ORIGIN: ""
